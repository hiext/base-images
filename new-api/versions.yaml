# new-api 镜像版本配置
# 此文件定义了构建 new-api 镜像所需的版本矩阵

# new-api 版本
# "latest" 自动跟踪最新版本，也可指定具体版本如 "v0.5.0"
new-api:
  - "v1.0.0-rc.25"
# 基础镜像配置
base_image: "debian:bookworm-slim"
# 构建配置
build:
  # 多架构支持
  platforms:
    - "linux/amd64"
    - "linux/arm64"
  # 暴露端口
  port: 3000
  # 构建参数
  args:
    NEW_API_VERSION: "latest"
