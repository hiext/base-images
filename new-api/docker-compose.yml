version: '3.8'

# new-api Docker Compose 配置
# 用于本地开发和测试

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEW_API_VERSION: latest
    image: new-api:local
    container_name: new-api-gateway

    # 端口映射
    ports:
      - "3000:3000"

    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - SESSION_SECRET=your_session_secret_here
      # SQL_DSN 配置示例（可选）
      # - SQL_DSN=postgres://user:password@postgres:5432/newapi

    # 数据卷
    volumes:
      - ./data:/data
      - ./logs:/var/log/new-api

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 3m
      timeout: 10s
      retries: 3
      start_period: 15s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

