name: Build and Push OpenClaw Images

on:
 workflow_dispatch:
 schedule:
 - cron: '0 0 * * 0' # 每周检查更新
 push:
 branches: [main]
 paths:
 - 'openclaw/**'
 - '.github/workflows/build-openclaw.yml'
 pull_request:
 paths:
 - 'openclaw/**'

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

permissions:
 packages: write
 contents: read

jobs:
 build-matrix:
 runs-on: ubuntu-latest
 strategy:
 fail-fast: false
 matrix:
 variant:
 - { name: "ubuntu", tag: "24.04", node: "24", suffix: "", dockerfile: "Dockerfile" }
 - { name: "ubuntu", tag: "22.04", node: "22", suffix: "-ubuntu22", dockerfile: "Dockerfile.ubuntu22" }
 - { name: "debian", tag: "bookworm", node: "24", suffix: "-debian", dockerfile: "Dockerfile.debian" }

 steps:
 - name: Checkout
 uses: actions/checkout@v4

 - name: Set up QEMU
 uses: docker/setup-qemu-action@v4

 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v4

 - name: Login to GitHub Container Registry
 uses: docker/login-action@v4
 if: github.event_name != 'pull_request'
 with:
 registry: ghcr.io
 username: ${{ github.repository_owner }}
 password: ${{ secrets.GITHUB_TOKEN }}

 - name: Generate image tags
 id: metadata
 uses: docker/metadata-action@v5
 with:
 images: ghcr.io/${{ github.repository_owner }}/openclaw
 tags: |
 type=raw,value=latest${{ matrix.variant.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
 type=raw,value=main${{ matrix.variant.suffix }},enable=${{ github.ref == 'refs/heads/main' }}

 - name: Build and push image
 uses: docker/build-push-action@v5
 with:
 context: openclaw/
 file: openclaw/${{ matrix.variant.dockerfile }}
 platforms: linux/amd64,linux/arm64
 push: ${{ github.event_name != 'pull_request' }}
 cache-from: type=gha,scope=openclaw-${{ matrix.variant.name }}-${{ matrix.variant.tag }}
 cache-to: type=gha,mode=max,scope=openclaw-${{ matrix.variant.name }}-${{ matrix.variant.tag }}
 tags: ${{ steps.metadata.outputs.tags }}
 labels: ${{ steps.metadata.outputs.labels }}
 build-args: |
 OPENCLAW_BASE_TAG=latest

 - name: Image digest
 run: |
 echo "Variant: ${{ matrix.variant.name }}:${{ matrix.variant.tag }}"
 echo "Dockerfile: ${{ matrix.variant.dockerfile }}"
 echo "Tags: ${{ steps.metadata.outputs.tags }}"
