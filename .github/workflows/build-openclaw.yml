name: Build and Push OpenClaw Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 每周检查更新
  push:
    branches: [main]
    paths:
      - 'openclaw/**'
      - '.github/workflows/build-openclaw.yml'
  pull_request:
    paths:
      - 'openclaw/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      changed: ${{ steps.check-update.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest OpenClaw version
        id: get-version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/openclaw/openclaw/releases/latest | \
            jq -r '.tag_name' | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      - name: Check if version changed
        id: check-update
        run: |
          CURRENT=$(yq '.openclaw[0]' openclaw/versions.yaml 2>/dev/null || echo "unknown")
          if [[ "$CURRENT" != "${{ steps.get-version.outputs.version }}" ]]; then
            echo "Version changed: $CURRENT -> ${{ steps.get-version.outputs.version }}"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged: $CURRENT"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  update-version:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update versions.yaml
        run: |
          yq -i ".openclaw[0] = \"${{ needs.check-version.outputs.version }}\"" openclaw/versions.yaml

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openclaw/versions.yaml
          git commit -m "chore: update OpenClaw to ${{ needs.check-version.outputs.version }}"
          git push

  matrix:
    runs-on: ubuntu-latest
    needs: check-version
    if: always()
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.get-matrix.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version matrix
        id: get-matrix
        uses: mikefarah/yq@v4
        with:
          cmd: yq eval -o=json -I=0 'openclaw/versions.yaml'

  build-and-push:
    runs-on: ubuntu-latest
    needs: [check-version, matrix]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        base_image:
          - name: ubuntu
            tag: "24.04"
            node_version: "24"
            suffix: ""
          - name: ubuntu
            tag: "22.04"
            node_version: "22"
            suffix: "-ubuntu22"
          - name: debian
            tag: bookworm
            node_version: "24"
            suffix: "-debian"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine if should push
        id: should-push
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "push=true" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.check-version.outputs.changed }}" == "true" ]]; then
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false
          images: |
            name=ghcr.io/${{ github.repository_owner }}/openclaw
          tags: |
            type=raw,value=${{ needs.check-version.outputs.version }}${{ matrix.base_image.suffix }}
            type=raw,value=latest${{ matrix.base_image.suffix }},enable=${{ matrix.base_image.suffix == '' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: openclaw/
          file: openclaw/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.should-push.outputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OPENCLAW_VERSION=${{ needs.check-version.outputs.version }}
            BASE_IMAGE=${{ matrix.base_image.name }}:${{ matrix.base_image.tag }}
            NODE_VERSION=${{ matrix.base_image.node_version }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  results:
    if: always()
    runs-on: ubuntu-latest
    name: Build Results
    needs: [build-and-push]
    steps:
      - name: Check results
        run: |
          result="${{ needs.build-and-push.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            echo "✅ Build completed successfully"
            exit 0
          else
            echo "❌ Build failed"
            exit 1
          fi