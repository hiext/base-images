# OpenClaw Docker Compose 配置（用户版）
# ==========================================
# 使用说明：
# 1. 创建工作目录：mkdir openclaw && cd openclaw
# 2. 下载此文件：curl -O ...
# 3. 创建数据目录：mkdir -p data config logs
# 4. 启动服务：docker compose up -d
# 5. 查看日志：docker compose logs -f
#
# 镜像说明：
# 此配置使用基于 OpenClaw 官方镜像构建的扩展镜像
# 在官方镜像基础上添加了：Python 3、FFmpeg、Git 等常用工具
#
# 官方镜像：ghcr.io/openclaw/openclaw:latest
# 扩展镜像：ghcr.io/hiext/openclaw:latest
# ==========================================

services:
  openclaw:
    # 使用基于官方 OpenClaw 构建的扩展镜像
    # 预装工具：Python 3.11、FFmpeg 5.1、Git、curl、wget、vim
    image: ghcr.io/hiext/openclaw:latest
    container_name: openclaw-gateway

    # 端口映射
    ports:
      - "18789:18789"

    # 环境变量配置
    environment:
      # 时区设置
      - OPENCLAW_TZ=Asia/Shanghai
      # 运行环境
      - NODE_ENV=production
      # 日志级别: debug, info, warn, error
      - LOG_LEVEL=info
      # Gateway 绑定地址（0.0.0.0 允许外部访问）
      # OpenClaw 使用 GATEWAY_BIND 而非 GATEWAY_HOST
      - GATEWAY_BIND=0.0.0.0

    # 数据持久化挂载
    volumes:
      # 应用数据（聊天记录、配置等）
      - ./data:/app/data
      # 配置文件目录
      - ./config:/app/config
      # 日志文件
      - ./logs:/var/log/openclaw

    # 自动重启策略
    restart: unless-stopped

    # 健康检查配置
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 3m
      timeout: 10s
      start_period: 30s
      retries: 3

    # 资源限制（可根据实际情况调整）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 网络配置（使用默认网络即可）
# ==========================================
# 快速开始：
#
# 启动服务：
#   docker compose up -d
#
# 查看状态：
#   docker compose ps
#   docker compose logs -f
#
# 停止服务：
#   docker compose down
#
# 更新镜像：
#   docker compose pull
#   docker compose up -d
#
# 访问地址：
#   Gateway:     ws://localhost:18789
#   Health:      http://localhost:18789/healthz
#   Browser:     http://localhost:18791/
# ==========================================
