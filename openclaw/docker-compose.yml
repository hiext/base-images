version: '3.8'

# OpenClaw Docker Compose 配置
# 用于本地开发和测试

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: latest
    image: openclaw:local
    container_name: openclaw-gateway

    # 端口映射
    ports:
      - "18789:18789"

    # 环境变量
    environment:
      - OPENCLAW_TZ=Asia/Shanghai
      - NODE_ENV=production
      - LOG_LEVEL=info
      - GATEWAY_BIND=0.0.0.0  # 允许外部访问

    # 数据卷
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/var/log/openclaw

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 3m
      timeout: 10s
      retries: 3
      start_period: 15s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 可选：网络配置
# networks:
#   openclaw-net:
#     driver: bridge

# 可选：数据卷定义
# volumes:
#   openclaw-data:
#     driver: local