# OpenClaw 默认配置文件
#
# 此文件包含 OpenClaw Gateway 的默认配置
# 可以通过环境变量或挂载自定义配置文件覆盖

# ============================================
# Gateway 配置
# ============================================

# Gateway 端口
GATEWAY_PORT=18789

# Gateway 绑定地址
# 127.0.0.1: 仅本地访问（默认）
# 0.0.0.0: 允许外部访问（需要配置认证）
GATEWAY_BIND=127.0.0.1

# ============================================
# 运行环境
# ============================================

# Node 环境
NODE_ENV=production

# 时区设置
OPENCLAW_TZ=UTC

# 日志级别
LOG_LEVEL=info

# ============================================
# 数据和存储
# ============================================

# 数据目录
OPENCLAW_DATA_DIR=/app/data

# 配置目录
OPENCLAW_CONFIG_DIR=/app/config

# 日志目录
OPENCLAW_LOG_DIR=/var/log/openclaw

# ============================================
# 功能开关
# ============================================

# 允许未配置启动
# true: 允许首次启动时未配置（用于初始化）
# false: 必须完成配置才能启动
ALLOW_UNCONFIGURED=true

# 启用调试模式
DEBUG_MODE=false

# ============================================
# 性能配置
# ============================================

# 最大内存限制（MB）
MAX_MEMORY=2048

# 最大并发连接数
MAX_CONNECTIONS=100

# 请求超时（秒）
REQUEST_TIMEOUT=30

# ============================================
# 安全配置
# ============================================

# 启用认证
ENABLE_AUTH=false

# JWT 密钥（生产环境必须更改）
# JWT_SECRET=your-secret-key-here

# CORS 配置
CORS_ENABLED=true
CORS_ORIGIN=*

# ============================================
# 扩展配置
# ============================================

# 启用的扩展列表（空格分隔）
# ENABLED_EXTENSIONS=diagnostics-otel matrix

# 扩展配置目录
EXTENSIONS_DIR=/app/extensions